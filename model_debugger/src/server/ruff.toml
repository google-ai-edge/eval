# ruff, the Python linter, in Google style:
#   bazel run //:ruff -- check "${PWD}/model_debugger"
# The code is formatted with Google's pyformat (two-space indents), which
# ruff's formatter does not reproduce, so only ruff's linter runs.
line-length = 80
indent-width = 2

[lint]
select = ["E", "F", "I", "D"]
pydocstyle.convention = "google"
# Tests document their test cases with their names: TestCase classes and
# methods (D101, D102), and pytest's top-level test functions (D103).
per-file-ignores = { "*_test.py" = ["D101", "D102", "D103"] }

[lint.isort]
# Google style: one import per line, except from typing and collections.abc,
# sorted by module name within each section, ignoring case.
force-single-line = true
single-line-exclusions = ["collections.abc", "typing"]
force-sort-within-sections = true
order-by-type = false
case-sensitive = false
# Every model_debugger package (the protocol, the server, the PyTorch runner)
# sorts with the third-party imports, where pyformat keeps them: Google style
# imports them by their full name, not as this directory's own.
known-third-party = ["model_debugger"]
