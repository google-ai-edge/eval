<button
  class="chat-menu"
  [matMenuTriggerFor]="chatMenu"
  [disabled]="!chats().length"
  aria-label="Chats"
  [matTooltip]="workspace.chat()?.summary ?? 'Chats'"
>
  <span class="chat-label">{{ label() }}</span>
  @if (workspace.chat(); as chat) {
    <span class="chat-state" [class.live]="chat.state === 'live'">{{
      chat.state === 'live' ? 'Live' : 'Ended'
    }}</span>
  }
  <mat-icon aria-hidden="true">arrow_drop_down</mat-icon>
</button>
<!-- The hint sits on a wrapper: a disabled button shows no tooltip. -->
<span class="new-chat-hint" [matTooltip]="newChat().allowed ? 'New chat' : newChat().reason"
  ><button
    mat-icon-button
    class="new-chat"
    aria-label="New chat"
    [disabled]="!newChat().allowed"
    [attr.aria-description]="newChat().reason || null"
    (click)="openNewChat()"
  >
    <mat-icon>add_comment</mat-icon>
  </button></span
>
<mat-menu #chatMenu="matMenu" class="chat-switcher-menu">
  @for (chat of chats(); track chat.n) {
    <button
      mat-menu-item
      role="menuitemradio"
      [attr.aria-checked]="workspace.chat()?.n === chat.n"
      [matTooltip]="chat.title + ' · ' + chat.summary"
      matTooltipPosition="right"
      (click)="show(chat)"
    >
      <mat-icon>{{ workspace.chat()?.n === chat.n ? 'check' : 'chat_bubble_outline' }}</mat-icon>
      <span class="chat-item">
        <span class="chat-title">{{ chat.title }} · {{ chat.summary }}</span>
        <small class="chat-item-state" [class.live]="chat.state === 'live'">{{
          state(chat)
        }}</small>
      </span>
    </button>
  }
</mat-menu>
