<script>
(()=>{'use strict';
// Throwaway interaction prototype: Model Explorer node colors were read from the local vendor.

}
activateLayer(0);
const state={page:'model',layer:0,hiddenIo:new Set(),selection:null,collapsed:new Set(['attention','ffn','ple']),scope:null,zoom:1,x:0,y:0};
const $=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let graphHeight=760;let positions={};let edgeIds=new Set();
const textMeasure=document.createElement('canvas').getContext('2d');
function labelWidth(label,bold=false){textMeasure.font=`${bold===500?500:bold?700:400} 11px "Google Sans Text"`;return textMeasure.measureText(label).width;}
const NO_STAGE_VALUE='No value: the layer is aligned to its execution graph only at its anchors.';
function archReady(){const m=analysisContext?.model;return m?.state==='ready'&&!!m.architecture;}
function layerCount(){return analysisContext?.model?.layerCount??0;}

function stageLayerIds(){return analysisContext?.model?.layerIds??[];}
function archMessage(){const m=analysisContext?.model;if(!m)return '';return m.state==='ready'?m.noTemplate:m.text;}

function anchorTag(id){const a=archLayer?.anchors[id];return a?analysisContext?.model?.anchors?.[state.layer]?.[a.id]||null:null;}
// Or, of a tensor no anchor is, the tag of the semantic operator whose output it is (a norm's), where
// the server pairs it across two runtimes.
function opTag(id){const node=tensors?.[id]?.producer;return node&&!archLayer?.anchors[id]?analysisContext?.model?.ops?.[state.layer]?.[node]||null:null;}
function formatShape(shape){const m=String(shape||'').match(/^([^\[]*)\[(.*)\]$/);return m?'['+m[2].split(',').map(s=>s.trim()).join(', ')+']':shape||'—';}
function archMetric(anchor,members){
 const empty={value:null,mode:'output',available:0,total:1,text:'—',bg:'var(--metric-empty-bg)',fg:'var(--muted)'};
 if(members!==undefined){const mode=analysisContext?.summary==='min'?'min':'max',total=new Set(members.filter(id=>id!==anchor)).size;return {...empty,mode,total,title:`Internal ${mode==='min'?'Min':'Max'} · ${NO_STAGE_VALUE}`};}
 const tag=anchorTag(anchor)||opTag(anchor);
 if(tag)return {value:tag.value,mode:'output',available:tag.value===null?0:1,total:1,text:tag.text,bg:tag.bg,fg:tag.fg,title:tag.title};
 const port=tensors?.[anchor]?.external?analysisContext?.model?.architecture?.ports?.[anchor]:'';
 return {...empty,title:port||NO_STAGE_VALUE};
}
function metricTagWidth(metric){
 textMeasure.font='500 13px "Google Sans Text"';return Math.ceil(textMeasure.measureText(metric.text).width)+14;
}
function metricTag(metric,x,y,configured){
 const withIcon=typeof configured==='boolean'||configured==='summary',iconWidth=withIcon?20:0,w=metricTagWidth(metric)+iconWidth,h=24;
 return `<g class="metric-tag arch-metric${withIcon?' tensor-metric':''}${metric.value===null?' is-empty':''}" data-metric-value="${metric.value??''}" aria-label="${escape(metric.title+' · '+metric.text)}" style="--metric-tag-bg:${escape(metric.bg)};--metric-tag-fg:${escape(metric.fg)}" transform="translate(${x},${y})"><title>${escape(metric.title)}</title><rect width="${w}" height="${h}" rx="3"/><rect class="metric-mask" width="${w}" height="${h}" rx="3"/>${withIcon?`<g class="tensor-glyph" transform="translate(5,${(h-12)/2})">${configured==='summary'?'<path class="summary-symbol" d="M6 1 11 3.5 6 6 1 3.5Z M1 6 6 8.5 11 6 M1 8.5 6 11 11 8.5"/>':tensorGlyph(configured)}</g>`:''}<text x="${iconWidth+(w-iconWidth)/2}" y="${h/2}" text-anchor="middle" dominant-baseline="central">${escape(metric.text)}</text></g>`;
}
function blockMetric(g){return archMetric(g.output,g.ops.flatMap(id=>ops[id].output));}
function blockSummaryWidth(g){return metricTagWidth(blockMetric(g))+20;}
function collapsedBlockWidth(g){return Math.max(80,Math.ceil(labelWidth(g.name,500)+40),blockSummaryWidth(g)+24);}
function tensorLabelWidth(id){return 9+20+metricTagWidth(archMetric(id));}
// Source: google-ai-edge/model-explorer styles.scss, graph_layout.ts and local renderer.
// Google Sans Text: op 500 / group 700 at 11 scene units; label y=14, node height=26.
// Icon atlas ink excludes 3px SDF padding: 7x13/14 at 32/50 scale; hit target 16x16.

function titleMetrics(label){textMeasure.font='500 11px "Google Sans Text"';const m=textMeasure.measureText(label);return {baseline:13+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2,left:-m.width/2-m.actualBoundingBoxLeft,right:-m.width/2+m.actualBoundingBoxRight};}

// and fan-out carrying a tensor in one range shares this same interaction identity.
function configurationScope(id){const tensor=tensors[id];return tensor?.producer?(tensor.group||'layer'):null;}

 const totalWidth=29+metricTagWidth(metric);
 return `<g class="tensor${boundary?' boundary':''}${paired?' is-paired':''}${selected?' selected':''}" ${attributes} data-pair-status="${paired?'paired':'unpaired'}"><rect class="tensor-hit" x="${cx-6}" y="${cy-13}" width="${totalWidth+6}" height="26"/><path class="tensor-leader" d="M${cx} ${cy}h9"/>${metricTag(metric,cx+9,cy-12,paired)}${tensorOutline(cx+8,cy-13,totalWidth-6,26)}</g>`;

 const width=metricTagWidth(metric)+20,x=cx-width/2;

}


// Architecture nodes are context; only tensors and configuration controls select.
function attrs(kind,id){if(kind==='tensor')return tensorAttrs(id);return `data-arch-node="${kind}" data-id="${id}"`;}
function tensorGlyph(configured){return configured?'<path class="cube-body" d="M6 .7L11 3.3v5.4L6 11.3 1 8.7V3.3z"/><path class="cube-seams" d="M1 3.3L6 6l5-2.7M6 6v5.3"/>':'<rect class="empty-frame" x="1" y="1" width="10" height="10" rx="1"/>';}
function node(kind,id,x,y,w,h){
const selected=state.selection?.kind===kind&&state.selection.id===id;
const activeOp=state.selection?.kind==='op'?ops[state.selection.id]:null;
const incoming=kind==='op'&&activeOp?.input.some(t=>!state.hiddenIo.has(t)&&tensors[t].producer===id);
const outgoing=kind==='op'&&activeOp?.output.some(t=>!state.hiddenIo.has(t)&&tensors[t].consumers.includes(id));

if(kind==='tensor'){
const cx=x+w/2,cy=y+h/2,metric=archMetric(id),totalWidth=tensorLabelWidth(id);
positions[id]={x:cx,y,w:totalWidth,h};

positions[id]={x:nodeCx-13,y,w:26,h:26};
return `<g class="op${relation}${selected?' selected':''}" ${attrs(kind,id)} transform="translate(${nodeCx-13},${y})"><title>${escape(ops[id].role+' · '+ops[id].purpose)}</title><circle cx="13" cy="13" r="${13-border/2}"/><path class="math-symbol" d="${ops[id].name==='Add'?'M7.5 13h11M13 7.5v11':'M9 9l8 8M17 9l-8 8'}"/></g>`;
}

function edge(path,tensor,residual=false,arrow=true,consumer=null){

const selectedOp=state.selection?.kind==='op'?ops[state.selection.id]:null;const direction=!state.hiddenIo.has(tensor)&&selectedOp?.input.includes(tensor)&&(!consumer||consumer===state.selection.id)?'incoming':!state.hiddenIo.has(tensor)&&selectedOp?.output.includes(tensor)?'outgoing':'';

const area=line?`<rect class="edge-area" x="${Number(line[1])-8}" y="${Math.min(Number(line[2]),Number(line[3]))}" width="16" height="${Math.abs(Number(line[3])-Number(line[2]))}"/>`:'';
return `<g class="tensor-flow" ${tensorAttrs(tensor,false)}>${area}<path class="edge-hit" d="${path}"/><path class="edge${residual?' residual-flow':''}${!arrow?' no-arrow':''}${paired?' paired':''}${direction?' '+direction:''}${selected?' tensor-selected':''}" d="${path}" marker-end="url(#${selected?'tensor-arrow':direction?direction+'-arrow':paired?'paired-arrow':'arrow'})"/></g>`;
}
function boundaryNode(label,y){return `<g class="arch-boundary" data-arch-node="boundary" role="img" aria-label="${state.scope?'Module':'Layer'} ${label.toLowerCase()}" transform="translate(280,${y})"><rect x=".6" y=".6" width="78.8" height="24.8" rx="5.4"/><text x="40" y="16.05" text-anchor="middle">${label}</text></g>`;}
function drawMessage(){hideIconTooltip();positions={};edgeIds=new Set();$('stage').innerHTML=`<div class="arch-message" role="status">${escape(archMessage())}</div>`;updateGraphControls();renderNavigation();}

if(state.page!=='layer'||!archLayer){drawMessage();return;}

const parts=[],backgrounds=[],cx=320,groupLeft=Math.min(10,cx-columnGap-70),groupRight=Math.max(630,...Object.values(ops).filter(o=>o.layout).map(o=>cx+o.layout.column*columnGap+tensorLabelWidth(o.output[0])+16)),boxes={},starts={};
