# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#
# This workflow will
# 1. Build Python Wheel Nightly Version
# 2. Upload to PyPI

name: Python Package Build and Release (nightly)

on:
  workflow_dispatch:  # Allow manual triggers
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/Los_Angeles'

permissions:
  contents: read

jobs:
  build-nightly:
    name: Build and Release Python Wheel Nightly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install

      - name: Build Nightly Package
        run: |
          python tools/build_wheels.py --type nightly

      - name: Upload Nightly Wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-edge-eval-nightly-wheel
          path: dist/*.whl

  test-before-publish:
    needs: build-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import ai-edge-eval-nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb2b236 # v4.7.1
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Download Nightly Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-edge-eval-nightly-wheel
          path: ./dist

      - name: Install ai-edge-eval-nightly
        run: |
          python -m pip install dist/*.whl

      - name: Import model_eval
        run: |
          python -c "import model_eval"

  publish-nightly:
    name: Publish to PyPI
    needs: test-before-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Nightly Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-edge-eval-nightly-wheel
          path: ./dist

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up failed staging attempt for this exact version (if any)
        run: |
          python3 - <<'PY'
          import email, glob, re, subprocess, tarfile, zipfile
          seen = set()
          for f in sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True)):
            try:
              if f.endswith(".whl"):
                with zipfile.ZipFile(f) as zf:
                  meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                  msg = email.message_from_bytes(zf.read(meta))
              else:
                with tarfile.open(f) as tf:
                  info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                  msg = email.message_from_bytes(tf.extractfile(info).read())
              pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
              ver = msg["Version"].strip()
            except Exception:
              continue
            if (pkg, ver) in seen:
              continue
            seen.add((pkg, ver))
            if subprocess.run([
                "gcloud", "artifacts", "versions", "describe", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=ai-edge-eval--pypi"
            ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              subprocess.run([
                  "gcloud", "artifacts", "versions", "delete", ver,
                  f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=ai-edge-eval--pypi", "--quiet"
              ], check=False)
          PY
      - name: Stage distributions to OSS Exit Gate and upload manifest
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -m pip install --upgrade twine
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          echo "::add-mask::${TWINE_PASSWORD}"
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/ai-edge-eval--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            dist/*.whl
          python3 - dist/*.whl <<'PY'
          import email, json, re, sys, tarfile, zipfile
          pairs = set()
          for path in sys.argv[1:]:
            if path.endswith(".whl"):
              with zipfile.ZipFile(path) as zf:
                for name in zf.namelist():
                  if name.endswith(".dist-info/METADATA"):
                    msg = email.message_from_bytes(zf.read(name))
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    pairs.add((pkg, msg["Version"].strip()))
                    break
            elif path.endswith(".tar.gz"):
              with tarfile.open(path, "r:gz") as tf:
                for member in tf.getmembers():
                  if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                    f = tf.extractfile(member)
                    if f is not None:
                      msg = email.message_from_bytes(f.read())
                      pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                      pairs.add((pkg, msg["Version"].strip()))
                    break
          if not pairs:
            raise SystemExit("ERROR: No .whl/.tar.gz package metadata found for manifest.json")
          manifest = {
              "publish_all": False,
              "publishing_groups": [{
                  "packages": [{"name": pkg, "version": ver} for pkg, ver in sorted(pairs)]
              }],
          }
          with open("manifest.json", "w", encoding="utf-8") as fh:
            json.dump(manifest, fh, indent=2)
            fh.write("\n")
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/ai-edge-eval/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"

  test-after-publish:
    needs: publish-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import ai-edge-eval-nightly from PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb2b236 # v4.7.1
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Install ai-edge-eval-nightly from PyPI
        run: |
          python -m pip install ai-edge-eval-nightly

      - name: Import model_eval
        run: |
          python -c "import model_eval"