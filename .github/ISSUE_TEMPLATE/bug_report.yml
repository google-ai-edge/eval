name: Bug Report
description: File a bug report for ai-edge-eval
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please fill out this form to help us investigate.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command, Python snippet, or configuration used.
      placeholder: |
        ai-edge-eval --runner litert-lm --model-path model.litertlm --tasks ifeval
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and ai-edge-eval version.
      placeholder: e.g., Ubuntu 22.04, Python 3.11, ai-edge-eval v0.0.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Copy and paste any relevant console output or stack traces.
      render: shell
